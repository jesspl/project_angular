<!-- Barra de navegación normal (pantallas grandes) -->
<div class="flexbox-exterior-container">
  <div class="flexbox-interior-container-row width-100 menu-desktop">
    <button mat-button routerLink='home' (click)="closeSidebar()">Home</button>
    <button mat-button routerLink='map' (click)="closeSidebar()">Map</button>
    <button mat-button routerLink='help' (click)="closeSidebar()">Help</button>
    <button mat-button routerLink='about' (click)="closeSidebar()">About</button>
    <button mat-button routerLink='calles-form' (click)="closeSidebar()">Calles</button>
    <button mat-button routerLink='semaforos-form' (click)="closeSidebar()">Semáforos</button>
    <button mat-button routerLink='manzanas-form' (click)="closeSidebar()">Manzanas</button>
    @if(authService.isAuthenticated){
      <span>{{authService.username}}</span>
      <button mat-button matTooltip="Close session" routerLink='logout-form'>
        <mat-icon style="transform:rotate(180deg);">logout</mat-icon>
      </button>
    } @else {
      <span>Not logged in</span>
      <button mat-button matTooltip="Init session" routerLink='login-form'>
        <mat-icon>login</mat-icon>
      </button>
    }
  </div>

  <!-- Botón hamburguesa (pantallas pequeñas) -->
  <div class="menu-mobile">
    <button mat-button (click)="toggleSidebar()">
      <mat-icon>{{ sidebarOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
    @if(authService.isAuthenticated){
      <span>{{authService.username}}</span>
    } @else {
      <span>Not logged in</span>
    }
  </div>
</div>

<!-- Sidebar (pantallas pequeñas) -->
@if(sidebarOpen){
  <div class="sidebar">
    <button mat-button routerLink='home' (click)="closeSidebar()">Home</button>
    <button mat-button routerLink='map' (click)="closeSidebar()">Map</button>
    <button mat-button routerLink='help' (click)="closeSidebar()">Help</button>
    <button mat-button routerLink='about' (click)="closeSidebar()">About</button>
    <button mat-button routerLink='calles-form' (click)="closeSidebar()">Calles</button>
    <button mat-button routerLink='semaforos-form' (click)="closeSidebar()">Semáforos</button>
    <button mat-button routerLink='manzanas-form' (click)="closeSidebar()">Manzanas</button>
    @if(authService.isAuthenticated){
      <button mat-button routerLink='logout-form' (click)="closeSidebar()">
        <mat-icon style="transform:rotate(180deg);">logout</mat-icon>
      </button>
    } @else {
      <button mat-button routerLink='login-form' (click)="closeSidebar()">
        <mat-icon>login</mat-icon>
      </button>
    }
  </div>
}
